name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate templates and data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq and jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          # yq from the official binary release (apt's yq is a different tool)
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install chezmoi
        run: |
          sudo sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

      - name: Initialize chezmoi with test data
        # The repo's .chezmoi.toml.tmpl uses promptStringOnce; supply dummy
        # answers so init does not block. --source points chezmoi at the
        # checked-out repo so we don't clone over the network.
        #
        # NOTE: --promptString keys are the *prompt text* (3rd arg of
        # promptStringOnce in .chezmoi.toml.tmpl), not the data key. If those
        # prompt strings change, update them here to match.
        env:
          CHEZMOI_SOURCE: ${{ github.workspace }}
        run: |
          chezmoi init \
            --source="$CHEZMOI_SOURCE" \
            --promptString "Full name (for git)=Test User" \
            --promptString "Email (for git)=test@example.com" \
            --promptString "SSH public key for commit signing (leave blank to skip)=" \
            --no-tty

      - name: Run validation
        run: bash test/validate.sh

      - name: Test the dangerous-git hook
        run: bash test/hook-block-dangerous-git.sh

      - name: Test the secret keyring helper
        run: bash test/secret.sh

      - name: Test the global git hook's secret scan
        run: bash test/git-hooks.sh

  secrets:
    name: Scan full history for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --log-opts="--all --full-history -m" .'
