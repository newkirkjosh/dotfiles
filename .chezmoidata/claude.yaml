---
# Claude Code settings, consumed by run_onchange_after_update-claude-settings.sh.tmpl.
# Keys under `claude.settings` are merged into ~/.claude/settings.json (our keys win).
# Keys under `claude.marketplace` are merged in alongside settings.

claude:
  # No managed marketplaces. Local settings.json state carries any
  # extraKnownMarketplaces (e.g. newkirkj-claude-plugins) machine-side.
  marketplace: {}

  settings:
    env:
      CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS: "1"
    teammateMode: tmux
    agentPushNotifEnabled: true
    # Suppress `Co-Authored-By: Claude` trailer in commits and the
    # `🤖 Generated with Claude Code` footer in PR bodies.
    attribution:
      commit: ""
      pr: ""
    # Refuse reads/edits of secret files regardless of permission mode.
    permissions:
      deny:
        - "Read(~/.claude/.credentials.json)"
        - "Edit(~/.claude/.credentials.json)"
        - "Read(**/.credentials.json)"
        - "Read(**/.env)"
        - "Edit(**/.env)"
        - "Read(**/.env.local)"
        - "Edit(**/.env.local)"
    statusLine:
      type: command
      # commandPath is relative to $HOME; the script expands it to an absolute path.
      commandPath: .claude/statusline-command.sh
    # Blocks destructive git commands before execution (reset --hard, clean
    # -f/-fd, branch -D, checkout ./restore ., force-push). Plain `git push`
    # is deliberately NOT blocked — confirm-before-push (CLAUDE.md's safety
    # posture) already covers it via the normal permission prompt; this hook
    # only hard-blocks operations with no legitimate "just do it" case.
    hooks:
      PreToolUse:
        - matcher: Bash
          hooks:
            - type: command
              command: "~/.claude/hooks/block-dangerous-git.sh"
    # `false` here is load-bearing: the merge script only ever adds keys
    # (jq `. * $required`), so it can never delete a plugin entry. Removing a
    # line leaves the machine-side `true` in settings.json untouched — the only
    # way to durably disable a plugin is to assert `false`.
    #
    # Disabled 2026-08-22 after a usage audit (0 invocations in 152 startups):
    #   posthog        — ~135 skill descriptions injected per prompt, no account
    #   swift-lsp      — iOS targets can't be built on this Linux host
    #   typescript-lsp — no TypeScript work on this machine
    #   amd-skills     — never used
    #   discord        — never used; its MCP server can't start (no `bun`)
    enabledPlugins:
      superpowers@claude-plugins-official: true
      code-review@claude-plugins-official: true
      claude-md-management@claude-plugins-official: true
      swift-lsp@claude-plugins-official: false
      skill-creator@claude-plugins-official: true
      frontend-design@claude-plugins-official: true
      typescript-lsp@claude-plugins-official: false
      code-simplifier@claude-plugins-official: true
      pr-review-toolkit@claude-plugins-official: true
      supabase@claude-plugins-official: true
      firebase@claude-plugins-official: true
      context7@claude-plugins-official: true
      gopls-lsp@claude-plugins-official: true
      posthog@claude-plugins-official: false
      figma@claude-plugins-official: true
      amd-skills@claude-plugins-official: false
      discord@claude-plugins-official: false
